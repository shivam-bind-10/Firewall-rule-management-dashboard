<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e1116">
  <title>fwdash — Firewall Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#/overview" aria-label="fwdash overview">
        <span class="brand-mark">fw</span>
        <span><strong>fwdash</strong><small>NETWORK POLICY</small></span>
      </a>
      <div class="side-section-label">WORKSPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="#/overview" data-route="overview"><span class="nav-icon">▦</span>Overview</a>
        <a href="#/rules" data-route="rules"><span class="nav-icon">≡</span>Rules<span class="nav-count" id="nav-rule-count">—</span></a>
        <a href="#/simulator" data-route="simulator"><span class="nav-icon">⌁</span>Simulator</a>
        <a href="#/logs" data-route="logs"><span class="nav-icon">◷</span>Activity log</a>
        <a href="#/export" data-route="export"><span class="nav-icon">⇧</span>Export</a>
      </nav>
      <div class="sidebar-bottom">
        <div class="connection-state"><span class="status-dot"></span><span>SIMULATION MODE</span></div>
        <div class="sidebar-foot">No system firewall access</div>
        <div class="sidebar-foot">fwdash <span id="app-version">v1.0</span></div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>POLICY ENGINE</span><span class="crumb-sep">/</span><strong id="page-label">Overview</strong></div>
        <div class="topbar-right">
          <span class="environment-tag"><span class="status-dot"></span>DEMO ENVIRONMENT</span>
          <span class="clock" id="clock"></span>
        </div>
      </header>
      <div class="status-line"><span class="status-dot"></span><span id="ruleset-status">Loading ruleset…</span><span class="status-separator">·</span><span>Changes are simulation-only</span></div>
      <section id="app-content" class="page-content" aria-live="polite"></section>
    </main>
  </div>
  <div id="drawer-root"></div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script src="/js/app.js" defer></script>
</body>
</html>
